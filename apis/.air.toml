[build]
  # Build the binary to the tmp directory
  cmd = "go build -o ./tmp/main ./cmd/web/main.go"
  # Run the binary
  bin = "./tmp/main"
  # Watch these extensions
  include_ext = ["go", "tpl", "tmpl", "html"]
  # Ignore these directories
  exclude_dir = ["assets", "tmp", "vendor", "client"]
  # Delay in milliseconds after the binary is killed before starting the new one
  kill_delay = 500
  # Stop running the binary on build errors
  stop_on_error = true

[log]
  time = true

[misc]
  # Delete tmp directory on exit
  clean_on_exit = true